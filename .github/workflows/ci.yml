name: Tests and container smoke

on:
  push:
    branches:
      - development/v0.2
      - development/v0.3
      - development/v0.4
      - development/v0.4-test-app
  pull_request:
    branches:
      - main
      - development/v0.1
      - development/v0.2
      - development/v0.3
      - development/v0.4

permissions:
  contents: read

jobs:
  tests-and-container:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Python dependencies
        run: python -m pip install -r ha_inventory/requirements.txt

      - name: Verify separate test add-on
        run: |
          if [ -d ha_inventory_test ]; then python scripts/sync-test-app.py --check; fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Run backend and frontend tests
        working-directory: ha_inventory
        run: |
          python -m unittest discover -s backend/tests -v
          node --test frontend/tests/*.test.mjs
          python -m compileall -q backend
          node --check frontend/app.js
          node --check frontend/api-client.mjs
          node --check frontend/product-prefill.mjs
          node --check frontend/stock.mjs
          node --check frontend/barcode-lookup.mjs
          node --check frontend/product-prefill.mjs
          node --check frontend/api-client.mjs
          node --check frontend/mobile-navigation.mjs
          node --check frontend/zxing-scanner.mjs
          node --check frontend/stock-booking.mjs
          node --check frontend/receipt-flow.mjs
          node --check frontend/vendor/zxing-browser.mjs

      - name: Build and smoke-test AMD64 container
        run: |
          if [ -d ha_inventory_test ]; then
            INVENTORY_SMOKE_APP_DIR=ha_inventory_test bash scripts/container-smoke.sh
          else
            bash scripts/container-smoke.sh
          fi

      - name: Build and smoke-test Raspberry Pi 4 ARM64 container
        env:
          INVENTORY_SMOKE_PLATFORM: linux/arm64
        run: |
          if [ -d ha_inventory_test ]; then
            INVENTORY_SMOKE_APP_DIR=ha_inventory_test bash scripts/container-smoke.sh
          else
            bash scripts/container-smoke.sh
          fi

name: Tests and container smoke

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  tests-and-container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run backend and frontend tests
        working-directory: ha_inventory
        run: |
          python -m unittest discover -s backend/tests -v
          node --test frontend/tests/*.test.mjs
          python -m compileall -q backend
          node --check frontend/app.js
          node --check frontend/stock.mjs
          node --check frontend/barcode-lookup.mjs

      - name: Build and smoke-test the container
        run: bash scripts/container-smoke.sh
